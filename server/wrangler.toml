# Rebound team server: one Worker (HTTP and WebSocket routing) and one Durable Object per team.
# See docs/SERVER.md for the API and server/README.md for running and deploying it.
name = "rebound-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Session tokens travel in the WebSocket URL's query string (browsers cannot set headers on WebSockets),
# so request logging stays off: it would keep those URLs. `npx wrangler tail` still shows live errors.
[observability]
enabled = false

[vars]
# Browser origins allowed to call the API (comma-separated, no trailing slashes). Others get no CORS headers,
# and their requests are refused.
ALLOWED_ORIGINS = "https://jiazegao.github.io,http://localhost:5173,http://localhost:4173"

[[durable_objects.bindings]]
name = "TEAM"
class_name = "TeamServer"

# The TeamServer class keeps each team's data in its own SQLite database.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamServer"]
