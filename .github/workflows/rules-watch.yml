# Each fall, look for next season's NSB rules and open an issue with the update checklist (MAINTAINING.md).
name: Watch for new NSB rules

on:
  schedule:
    # Mondays, September through December, 15:17 UTC.
    - cron: '17 15 * 9-12 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: watch
        run: node scripts/rules/watch.mjs
      - name: Open or update the issue
        if: steps.watch.outputs.action == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.watch.outputs.title }}
          FOUND: ${{ steps.watch.outputs.found }}
        run: |
          number=$(gh issue list --state all --limit 100 --search "\"$TITLE\" in:title" --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file rules-issue.md
          elif [ "$FOUND" = "true" ] && [ "$(gh issue view "$number" --json state --jq .state)" = "OPEN" ]; then
            if ! gh issue view "$number" --json body,comments --jq '.body, .comments[].body' | grep -q "appears to have posted"; then
              gh issue comment "$number" --body-file rules-issue.md
            fi
          fi
