# Deploy the team server (server/) to Cloudflare by hand: Actions → "Deploy team server" → Run workflow.
# One-time setup (MAINTAINING.md): repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Deploy the server before merging a site change that needs it (a new sync collection or route).
name: Deploy team server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (see MAINTAINING.md)."
            exit 1
          fi
          npx wrangler deploy
      - name: Check that it answers
        run: |
          url=$(grep -o 'VITE_SERVER_URL: [^ ]*' ../.github/workflows/deploy.yml | cut -d' ' -f2)
          sleep 5
          curl -fsS "$url/api/health"
